<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <!-- Left Shield Emblem -->
  <g transform="translate(10, 8)">
    <!-- Base Shield -->
    <path d="M 6 4 L 90 4 Q 90 82 48 104 Q 6 82 6 4 Z" fill="#1b365d" />
    
    <!-- White Curve 1 -->
    <path d="M 6 28 Q 48 42 90 20 Q 84 40 48 54 Q 12 44 6 28 Z" fill="#ffffff" />
    <!-- White Curve 2 -->
    <path d="M 6 56 Q 48 70 90 48 Q 82 68 48 82 Q 14 70 6 56 Z" fill="#ffffff" />
    
    <!-- Green Dynamic Swoosh -->
    <path d="M 6 62 Q 48 76 84 58 Q 76 74 48 86 Q 16 74 6 62 Z" fill="#4caf50" />
    
    <!-- Sky Blue Accent Base -->
    <path d="M 6 80 Q 48 96 74 78 Q 64 92 48 100 Q 22 90 6 80 Z" fill="#0099e6" />
  </g>

  <!-- High-Legibility Bold Typography -->
  <g transform="translate(118, 0)">
    <!-- UTTARANCHAL -->
    <text x="0" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="40" font-weight="900" letter-spacing="1" fill="#111827">UTTARANCHAL</text>
    
    <!-- UNIVERSITY -->
    <text x="0" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="42" font-weight="900" letter-spacing="2.5" fill="#111827">UNIVERSITY</text>
    
    <!-- Strong Underline -->
    <line x1="0" y1="91" x2="330" y2="91" stroke="#9ca3af" stroke-width="2.5" />
    
    <!-- NAAC GRADE A+ -->
    <text x="0" y="113" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#0284c7">NAAC GRADE</text>
    <line x1="160" y1="96" x2="170" y2="117" stroke="#6b7280" stroke-width="3" />
    <text x="180" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#0284c7">A+</text>
  </g>
</svg>
